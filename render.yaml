services:
  - type: web
    name: meridian
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # Not "production": that setting refuses the sandbox and HD custody
      # providers by design, and a demo has no real custodian behind it.
      - key: NODE_ENV
        value: development
      - key: PORT
        value: "10000"
      # A remote libSQL (Turso) database, so data survives deploys and the
      # sleep/wake cycle that wipes a free instance's filesystem. Set both in
      # the dashboard: the URL looks like libsql://<name>-<org>.turso.io.
      - key: DATABASE_PATH
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      # Set these in the Render dashboard. Both need at least 32 characters.
      - key: SESSION_SECRET
        sync: false
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: CUSTODY_PROVIDER
        value: hd
      # Generate with: bun run new-mnemonic
      - key: CUSTODY_MNEMONIC
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      # Without a key the price feed is rate limited by IP, and a free
      # instance shares its egress address with other tenants. Get one from
      # coingecko.com/en/api/pricing (Demo tier, free).
      - key: COINGECKO_API_KEY
        sync: false
